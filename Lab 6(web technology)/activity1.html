<!DOCTYPE html>
<html>
<head>
    <title>Number Field Example</title>
</head>
<body>
<h3>A demonstration of how to access a Number field</h3>
<input type="number" id="myNumber" value="2">
<p>Click the button to get the number of the number field.</p>
<button onclick="myFunction()">Try it</button>
<p id="demo"></p>
<script>
function myFunction() {
    var x = document.getElementById("myNumber").value;
    document.getElementById("demo").innerHTML = "Entered number is: " + x;
}
</script>
</body>
</html>
