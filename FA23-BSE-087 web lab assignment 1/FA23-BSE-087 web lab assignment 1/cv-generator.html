<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CV Generator – Web Technologies Lab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <style>
    :root {
      --ink: #1a1a2e;
      --paper: #f8f5f0;
      --accent: #c8973f;
      --accent2: #2d6a8a;
      --muted: #7a7a8c;
      --border: #e0dbd2;
      --shadow: 0 8px 40px rgba(26,26,46,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── TOP NAV ── */
    .app-nav {
      background: var(--ink);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 999;
    }
    .app-nav .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .app-nav .brand span { color: #fff; }
    .nav-step-pills { display: flex; gap: 0.4rem; }
    .step-pill {
      padding: 0.3rem 1rem;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      border: 1.5px solid #333;
      cursor: pointer;
      transition: all .2s;
    }
    .step-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .step-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

    /* ── LAYOUT ── */
    .app-wrap {
      display: grid;
      grid-template-columns: 420px 1fr;
      min-height: calc(100vh - 56px);
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      background: #fff;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 0 0 2rem 0;
    }
    .section-header {
      background: var(--ink);
      color: #fff;
      padding: 0.75rem 1.5rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-header i { color: var(--accent); font-size: 0.9rem; }
    .form-block { padding: 1.2rem 1.5rem 0.5rem; }
    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .form-control, .form-select {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      padding: 0.55rem 0.8rem;
      color: var(--ink);
      transition: border-color .2s;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,151,63,0.15);
    }
    .form-control::placeholder { color: #b0b0bf; }
    .add-btn {
      background: none;
      border: 1.5px dashed var(--accent);
      color: var(--accent);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all .2s;
    }
    .add-btn:hover { background: rgba(200,151,63,0.08); }
    .entry-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.7rem;
      position: relative;
    }
    .entry-card .remove-btn {
      position: absolute; top: 0.6rem; right: 0.7rem;
      background: none; border: none; color: #ccc;
      font-size: 1rem; cursor: pointer; transition: color .2s;
    }
    .entry-card .remove-btn:hover { color: #e05; }

    /* Template selector */
    .template-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.7rem;
      padding: 1rem 1.5rem;
    }
    .tpl-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem;
      cursor: pointer;
      text-align: center;
      transition: all .2s;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }
    .tpl-card:hover { border-color: var(--accent); color: var(--accent); }
    .tpl-card.selected { border-color: var(--accent); background: rgba(200,151,63,0.1); color: var(--accent); }
    .tpl-card .tpl-thumb {
      height: 50px;
      border-radius: 6px;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    /* Color picker row */
    .color-row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; padding: 0.5rem 1.5rem 1rem; }
    .color-swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform .15s;
    }
    .color-swatch:hover, .color-swatch.active { transform: scale(1.2); border-color: var(--ink); }

    /* Action buttons */
    .action-bar {
      padding: 1.2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .btn-generate {
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.9rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-generate:hover { background: #2d2d50; }
    .btn-export {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.9rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-export:hover { background: #b07e2d; }
    .btn-reset {
      background: none;
      color: var(--muted);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-reset:hover { border-color: var(--muted); color: var(--ink); }

    /* ── RIGHT PANEL – PREVIEW ── */
    .right-panel {
      background: #e8e4dd;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      overflow-y: auto;
    }
    .cv-sheet {
      width: 794px;
      min-height: 1123px;
      background: #fff;
      box-shadow: var(--shadow);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      transition: all .3s;
    }

    /* ─────────────────────────────────────────────────
       TEMPLATE: Classic
    ───────────────────────────────────────────────── */
    .tpl-classic .cv-header {
      background: var(--cv-color, #1a1a2e);
      color: #fff;
      padding: 2.5rem 2.8rem 2rem;
    }
    .tpl-classic .cv-name {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }
    .tpl-classic .cv-title {
      font-size: 1rem;
      font-weight: 400;
      opacity: 0.75;
      margin-top: 0.3rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .tpl-classic .cv-contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.5rem;
      margin-top: 1rem;
      font-size: 0.82rem;
      opacity: 0.85;
    }
    .tpl-classic .cv-contact-row span { display: flex; align-items: center; gap: 0.4rem; }
    .tpl-classic .cv-body { display: grid; grid-template-columns: 1fr 280px; gap: 0; }
    .tpl-classic .cv-main { padding: 1.8rem 2rem; }
    .tpl-classic .cv-side {
      background: #f4f2ee;
      padding: 1.8rem 1.5rem;
      border-left: 1px solid var(--border);
    }
    .tpl-classic .cv-section-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--cv-color, #1a1a2e);
      border-bottom: 2px solid var(--cv-color, #1a1a2e);
      padding-bottom: 0.3rem;
      margin-bottom: 1rem;
    }
    .tpl-classic .cv-entry { margin-bottom: 1.2rem; }
    .tpl-classic .cv-entry-title { font-size: 0.95rem; font-weight: 600; }
    .tpl-classic .cv-entry-sub { font-size: 0.82rem; color: var(--muted); }
    .tpl-classic .cv-entry-date {
      font-size: 0.72rem;
      color: #fff;
      background: var(--cv-color, #1a1a2e);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      display: inline-block;
      margin: 0.2rem 0;
    }
    .tpl-classic .cv-entry-desc { font-size: 0.82rem; color: #555; margin-top: 0.25rem; line-height: 1.5; }
    .tpl-classic .skill-tag {
      display: inline-block;
      background: var(--cv-color, #1a1a2e);
      color: #fff;
      font-size: 0.72rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      margin: 0.15rem 0.2rem 0.15rem 0;
    }
    .tpl-classic .cv-summary { font-size: 0.85rem; line-height: 1.6; color: #444; margin-bottom: 1.5rem; }

    /* ─────────────────────────────────────────────────
       TEMPLATE: Modern
    ───────────────────────────────────────────────── */
    .tpl-modern .cv-header {
      padding: 2.5rem 2.8rem 1.8rem;
      border-top: 8px solid var(--cv-color, #2d6a8a);
    }
    .tpl-modern .cv-name {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--cv-color, #2d6a8a);
      line-height: 1;
    }
    .tpl-modern .cv-title {
      font-size: 1rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 0.2rem;
    }
    .tpl-modern .cv-contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .tpl-modern .cv-contact-row span { display: flex; align-items: center; gap: 0.35rem; }
    .tpl-modern .cv-body { padding: 0 2.8rem 2rem; }
    .tpl-modern .cv-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--cv-color, #2d6a8a);
      margin: 1.5rem 0 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tpl-modern .cv-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--cv-color, #2d6a8a);
      opacity: 0.3;
    }
    .tpl-modern .cv-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0 2rem; }
    .tpl-modern .cv-full { grid-column: 1 / -1; }
    .tpl-modern .cv-entry { margin-bottom: 1rem; }
    .tpl-modern .cv-entry-title { font-size: 0.9rem; font-weight: 600; }
    .tpl-modern .cv-entry-sub { font-size: 0.8rem; color: var(--muted); }
    .tpl-modern .cv-entry-date { font-size: 0.72rem; color: var(--cv-color, #2d6a8a); font-weight: 600; }
    .tpl-modern .cv-entry-desc { font-size: 0.8rem; color: #555; margin-top: 0.2rem; line-height: 1.5; }
    .tpl-modern .skill-tag {
      display: inline-block;
      border: 1.5px solid var(--cv-color, #2d6a8a);
      color: var(--cv-color, #2d6a8a);
      font-size: 0.72rem;
      padding: 0.18rem 0.55rem;
      border-radius: 20px;
      margin: 0.15rem 0.2rem 0.15rem 0;
    }
    .tpl-modern .cv-summary { font-size: 0.83rem; line-height: 1.6; color: #444; }

    /* ─────────────────────────────────────────────────
       TEMPLATE: Minimal
    ───────────────────────────────────────────────── */
    .tpl-minimal .cv-header {
      padding: 2.8rem 3rem 1.5rem;
      border-left: 5px solid var(--cv-color, #c8973f);
      margin: 2rem 2rem 0;
    }
    .tpl-minimal .cv-name {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--ink);
    }
    .tpl-minimal .cv-title {
      font-size: 0.9rem;
      color: var(--cv-color, #c8973f);
      font-weight: 500;
      margin-top: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .tpl-minimal .cv-contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.2rem;
      margin-top: 0.7rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .tpl-minimal .cv-contact-row span { display: flex; align-items: center; gap: 0.3rem; }
    .tpl-minimal .cv-body { padding: 1rem 3rem 2rem; }
    .tpl-minimal .cv-section-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--cv-color, #c8973f);
      margin: 1.5rem 0 0.8rem;
    }
    .tpl-minimal .cv-entry { margin-bottom: 1rem; display: grid; grid-template-columns: 1fr 120px; gap: 0 1rem; }
    .tpl-minimal .cv-entry-main {}
    .tpl-minimal .cv-entry-right { text-align: right; }
    .tpl-minimal .cv-entry-title { font-size: 0.88rem; font-weight: 600; }
    .tpl-minimal .cv-entry-sub { font-size: 0.78rem; color: var(--muted); }
    .tpl-minimal .cv-entry-date { font-size: 0.72rem; color: var(--muted); }
    .tpl-minimal .cv-entry-desc { font-size: 0.8rem; color: #555; margin-top: 0.2rem; line-height: 1.5; grid-column: 1 / -1; }
    .tpl-minimal .skill-tag {
      display: inline-block;
      font-size: 0.72rem;
      color: #555;
      margin: 0.1rem 0.3rem 0.1rem 0;
    }
    .tpl-minimal .skill-tag::before { content: '—'; margin-right: 0.3rem; color: var(--cv-color, #c8973f); }
    .tpl-minimal .cv-summary { font-size: 0.83rem; line-height: 1.6; color: #444; }
    .tpl-minimal hr.cv-rule { border: none; border-top: 1px solid var(--border); margin: 0.3rem 0; }

    /* Progress bar for skills (classic/modern) */
    .skill-bar-wrap { margin: 0.25rem 0 0.6rem; }
    .skill-bar-label { font-size: 0.75rem; color: var(--ink); display: flex; justify-content: space-between; }
    .skill-bar { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 0.2rem; }
    .skill-bar-fill { height: 100%; background: var(--cv-color, #1a1a2e); border-radius: 4px; transition: width 0.5s; }

    /* ── TABS ── */
    .form-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .form-tab {
      padding: 0.7rem 1.2rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .2s;
    }
    .form-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
    .form-tab:hover:not(.active) { color: var(--ink); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── EMPTY STATE ── */
    .empty-cv {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 400px;
      color: var(--muted);
      text-align: center;
      gap: 1rem;
    }
    .empty-cv i { font-size: 3rem; opacity: 0.3; }
    .empty-cv p { font-size: 0.9rem; opacity: 0.6; }

    /* Photo upload circle */
    .photo-upload-wrap { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .photo-circle {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 2px dashed var(--accent);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      overflow: hidden;
      background: var(--paper);
      color: var(--accent);
      font-size: 1.5rem;
      transition: background .2s;
      flex-shrink: 0;
    }
    .photo-circle:hover { background: rgba(200,151,63,0.1); }
    .photo-circle img { width: 100%; height: 100%; object-fit: cover; }
    .photo-hint { font-size: 0.75rem; color: var(--muted); }

    /* Responsive: stack on small screens */
    @media (max-width: 900px) {
      .app-wrap { grid-template-columns: 1fr; }
      .right-panel { padding: 1.5rem 0.5rem; }
      .cv-sheet { width: 100%; }
    }
    @media print {
      .app-nav, .left-panel { display: none !important; }
      .right-panel { padding: 0; background: none; }
      .cv-sheet { box-shadow: none; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="app-nav">
  <div class="brand">CV<span> Generator</span></div>
  <div class="nav-step-pills">
    <div class="step-pill active" onclick="showTab('personal')"><i class="fa fa-user"></i> Personal</div>
    <div class="step-pill" onclick="showTab('education')"><i class="fa fa-graduation-cap"></i> Education</div>
    <div class="step-pill" onclick="showTab('experience')"><i class="fa fa-briefcase"></i> Experience</div>
    <div class="step-pill" onclick="showTab('skills')"><i class="fa fa-code"></i> Skills</div>
    <div class="step-pill" onclick="showTab('design')"><i class="fa fa-palette"></i> Design</div>
  </div>
</nav>

<div class="app-wrap">

  <!-- ── LEFT PANEL ── -->
  <div class="left-panel">

    <!-- TAB: PERSONAL -->
    <div id="tab-personal" class="tab-panel active">
      <div class="section-header"><i class="fa fa-user"></i> Personal Information</div>
      <div class="form-block">
        <div class="photo-upload-wrap">
          <div class="photo-circle" id="photoCircle" onclick="document.getElementById('photoInput').click()">
            <i class="fa fa-camera" id="photoIcon"></i>
            <img id="photoPreview" style="display:none"/>
          </div>
          <div class="photo-hint">Click to upload<br>profile photo (optional)</div>
          <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(event)"/>
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" placeholder="Muhammad" oninput="liveUpdate()"/>
          </div>
          <div class="col-6">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" placeholder="Ali" oninput="liveUpdate()"/>
          </div>
          <div class="col-12">
            <label class="form-label">Job Title / Tagline</label>
            <input type="text" class="form-control" id="jobTitle" placeholder="Full Stack Developer" oninput="liveUpdate()"/>
          </div>
          <div class="col-12">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="you@email.com" oninput="liveUpdate()"/>
          </div>
          <div class="col-6">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" placeholder="+92 300 0000000" oninput="liveUpdate()"/>
          </div>
          <div class="col-6">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" id="location" placeholder="Vehari, Pakistan" oninput="liveUpdate()"/>
          </div>
          <div class="col-12">
            <label class="form-label">LinkedIn / Website</label>
            <input type="text" class="form-control" id="website" placeholder="linkedin.com/in/yourname" oninput="liveUpdate()"/>
          </div>
          <div class="col-12">
            <label class="form-label">Professional Summary</label>
            <textarea class="form-control" id="summary" rows="4" placeholder="Brief overview of your professional background and key strengths..." oninput="liveUpdate()"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB: EDUCATION -->
    <div id="tab-education" class="tab-panel">
      <div class="section-header"><i class="fa fa-graduation-cap"></i> Education</div>
      <div id="eduEntries" style="padding:0.8rem 1.5rem 0.5rem;"></div>
      <div style="padding:0 1.5rem;">
        <button class="add-btn" onclick="addEntry('edu')"><i class="fa fa-plus"></i> Add Education</button>
      </div>
    </div>

    <!-- TAB: EXPERIENCE -->
    <div id="tab-experience" class="tab-panel">
      <div class="section-header"><i class="fa fa-briefcase"></i> Work Experience</div>
      <div id="expEntries" style="padding:0.8rem 1.5rem 0.5rem;"></div>
      <div style="padding:0 1.5rem;">
        <button class="add-btn" onclick="addEntry('exp')"><i class="fa fa-plus"></i> Add Experience</button>
      </div>
    </div>

    <!-- TAB: SKILLS -->
    <div id="tab-skills" class="tab-panel">
      <div class="section-header"><i class="fa fa-code"></i> Skills & Languages</div>
      <div id="skillEntries" style="padding:0.8rem 1.5rem 0.5rem;"></div>
      <div style="padding:0 1.5rem;">
        <button class="add-btn" onclick="addEntry('skill')"><i class="fa fa-plus"></i> Add Skill</button>
      </div>
      <div class="section-header" style="margin-top:0.5rem;"><i class="fa fa-globe"></i> Languages</div>
      <div id="langEntries" style="padding:0.8rem 1.5rem 0.5rem;"></div>
      <div style="padding:0 1.5rem;">
        <button class="add-btn" onclick="addEntry('lang')"><i class="fa fa-plus"></i> Add Language</button>
      </div>
      <div class="section-header" style="margin-top:0.5rem;"><i class="fa fa-certificate"></i> Certifications</div>
      <div id="certEntries" style="padding:0.8rem 1.5rem 0.5rem;"></div>
      <div style="padding:0 1.5rem;">
        <button class="add-btn" onclick="addEntry('cert')"><i class="fa fa-plus"></i> Add Certification</button>
      </div>
    </div>

    <!-- TAB: DESIGN -->
    <div id="tab-design" class="tab-panel">
      <div class="section-header"><i class="fa fa-palette"></i> Choose Template</div>
      <div class="template-grid">
        <div class="tpl-card selected" onclick="selectTemplate('classic')" id="tpl-classic">
          <div class="tpl-thumb" style="background:#1a1a2e; color:#c8973f;">⬛</div>
          Classic
        </div>
        <div class="tpl-card" onclick="selectTemplate('modern')" id="tpl-modern">
          <div class="tpl-thumb" style="background:#eef6fb; color:#2d6a8a;">🔵</div>
          Modern
        </div>
        <div class="tpl-card" onclick="selectTemplate('minimal')" id="tpl-minimal">
          <div class="tpl-thumb" style="background:#fff8f0; color:#c8973f;">🟡</div>
          Minimal
        </div>
      </div>
      <div class="section-header"><i class="fa fa-paint-brush"></i> Accent Color</div>
      <div class="color-row">
        <div class="color-swatch active" style="background:#1a1a2e" onclick="setColor('#1a1a2e',this)"></div>
        <div class="color-swatch" style="background:#2d6a8a" onclick="setColor('#2d6a8a',this)"></div>
        <div class="color-swatch" style="background:#c8973f" onclick="setColor('#c8973f',this)"></div>
        <div class="color-swatch" style="background:#3a7d44" onclick="setColor('#3a7d44',this)"></div>
        <div class="color-swatch" style="background:#7b2d8b" onclick="setColor('#7b2d8b',this)"></div>
        <div class="color-swatch" style="background:#c0392b" onclick="setColor('#c0392b',this)"></div>
        <div class="color-swatch" style="background:#1a6b5a" onclick="setColor('#1a6b5a',this)"></div>
        <input type="color" id="customColor" title="Custom color" style="width:28px;height:28px;padding:0;border-radius:50%;border:2px solid var(--border);cursor:pointer;" onchange="setColor(this.value,null)"/>
      </div>
    </div>

    <!-- ACTION BAR -->
    <div class="action-bar">
      <button class="btn-generate" onclick="generateCV()">
        <i class="fa fa-magic"></i> Generate Preview
      </button>
      <button class="btn-export" onclick="exportPDF()">
        <i class="fa fa-file-pdf"></i> Export as PDF
      </button>
      <button class="btn-reset" onclick="resetAll()">
        <i class="fa fa-rotate-left"></i> Reset
      </button>
    </div>
  </div>

  <!-- ── RIGHT PANEL ── -->
  <div class="right-panel">
    <div class="cv-sheet tpl-classic" id="cvPreview">
      <div class="empty-cv">
        <i class="fa fa-file-lines"></i>
        <p>Fill in your details and click<br><strong>Generate Preview</strong></p>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ─── STATE ───
let currentTemplate = 'classic';
let currentColor = '#1a1a2e';
let photoDataURL = null;
let eduList = [];
let expList = [];
let skillList = [];
let langList = [];
let certList = [];
let entryCounters = { edu: 0, exp: 0, skill: 0, lang: 0, cert: 0 };

// ─── TAB SWITCHING ───
function showTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.step-pill').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
}

// ─── TEMPLATE ───
function selectTemplate(name) {
  currentTemplate = name;
  document.querySelectorAll('.tpl-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('tpl-' + name).classList.add('selected');
  liveUpdate();
}

// ─── COLOR ───
function setColor(hex, el) {
  currentColor = hex;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
  liveUpdate();
}

// ─── PHOTO ───
function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    photoDataURL = ev.target.result;
    const img = document.getElementById('photoPreview');
    img.src = photoDataURL;
    img.style.display = 'block';
    document.getElementById('photoIcon').style.display = 'none';
    liveUpdate();
  };
  reader.readAsDataURL(file);
}

// ─── ENTRY MANAGEMENT ───
function addEntry(type) {
  const id = ++entryCounters[type];
  const containers = { edu: 'eduEntries', exp: 'expEntries', skill: 'skillEntries', lang: 'langEntries', cert: 'certEntries' };
  const container = document.getElementById(containers[type]);
  const div = document.createElement('div');
  div.className = 'entry-card';
  div.id = type + '-card-' + id;
  div.innerHTML = buildEntryForm(type, id);
  container.appendChild(div);
  updateList(type);
}

function buildEntryForm(type, id) {
  const rm = `<button class="remove-btn" onclick="removeEntry('${type}',${id})"><i class="fa fa-xmark"></i></button>`;
  if (type === 'edu') return `${rm}
    <div class="row g-2">
      <div class="col-12"><label class="form-label">Degree / Certificate</label>
        <input class="form-control" id="edu-degree-${id}" placeholder="BS Computer Science" oninput="updateList('edu')"/></div>
      <div class="col-12"><label class="form-label">Institution</label>
        <input class="form-control" id="edu-inst-${id}" placeholder="COMSATS University" oninput="updateList('edu')"/></div>
      <div class="col-6"><label class="form-label">Start Year</label>
        <input class="form-control" id="edu-start-${id}" placeholder="2022" oninput="updateList('edu')"/></div>
      <div class="col-6"><label class="form-label">End Year</label>
        <input class="form-control" id="edu-end-${id}" placeholder="2026 / Present" oninput="updateList('edu')"/></div>
      <div class="col-12"><label class="form-label">Description / CGPA</label>
        <input class="form-control" id="edu-desc-${id}" placeholder="CGPA: 3.8 / 4.0" oninput="updateList('edu')"/></div>
    </div>`;
  if (type === 'exp') return `${rm}
    <div class="row g-2">
      <div class="col-12"><label class="form-label">Job Title</label>
        <input class="form-control" id="exp-title-${id}" placeholder="Frontend Developer" oninput="updateList('exp')"/></div>
      <div class="col-12"><label class="form-label">Company / Organization</label>
        <input class="form-control" id="exp-company-${id}" placeholder="Tech Corp" oninput="updateList('exp')"/></div>
      <div class="col-6"><label class="form-label">Start Date</label>
        <input class="form-control" id="exp-start-${id}" placeholder="Jan 2024" oninput="updateList('exp')"/></div>
      <div class="col-6"><label class="form-label">End Date</label>
        <input class="form-control" id="exp-end-${id}" placeholder="Present" oninput="updateList('exp')"/></div>
      <div class="col-12"><label class="form-label">Responsibilities</label>
        <textarea class="form-control" id="exp-desc-${id}" rows="2" placeholder="Key responsibilities and achievements..." oninput="updateList('exp')"></textarea></div>
    </div>`;
  if (type === 'skill') return `${rm}
    <div class="row g-2">
      <div class="col-8"><label class="form-label">Skill Name</label>
        <input class="form-control" id="skill-name-${id}" placeholder="JavaScript" oninput="updateList('skill')"/></div>
      <div class="col-4"><label class="form-label">Level %</label>
        <input type="number" class="form-control" id="skill-level-${id}" placeholder="85" min="10" max="100" oninput="updateList('skill')"/></div>
    </div>`;
  if (type === 'lang') return `${rm}
    <div class="row g-2">
      <div class="col-7"><label class="form-label">Language</label>
        <input class="form-control" id="lang-name-${id}" placeholder="English" oninput="updateList('lang')"/></div>
      <div class="col-5"><label class="form-label">Proficiency</label>
        <select class="form-select" id="lang-level-${id}" onchange="updateList('lang')">
          <option>Native</option><option>Fluent</option><option>Advanced</option><option>Intermediate</option><option>Basic</option>
        </select></div>
    </div>`;
  if (type === 'cert') return `${rm}
    <div class="row g-2">
      <div class="col-12"><label class="form-label">Certification</label>
        <input class="form-control" id="cert-name-${id}" placeholder="AWS Certified Solutions Architect" oninput="updateList('cert')"/></div>
      <div class="col-6"><label class="form-label">Issuer</label>
        <input class="form-control" id="cert-issuer-${id}" placeholder="Amazon" oninput="updateList('cert')"/></div>
      <div class="col-6"><label class="form-label">Year</label>
        <input class="form-control" id="cert-year-${id}" placeholder="2025" oninput="updateList('cert')"/></div>
    </div>`;
}

function removeEntry(type, id) {
  const card = document.getElementById(type + '-card-' + id);
  if (card) card.remove();
  updateList(type);
}

function updateList(type) {
  if (type === 'edu') {
    eduList = [];
    document.querySelectorAll('[id^="edu-degree-"]').forEach(el => {
      const i = el.id.split('-')[2];
      const degree = el.value;
      const inst = v(`edu-inst-${i}`);
      const start = v(`edu-start-${i}`);
      const end = v(`edu-end-${i}`);
      const desc = v(`edu-desc-${i}`);
      if (degree || inst) eduList.push({ degree, inst, start, end, desc });
    });
  }
  if (type === 'exp') {
    expList = [];
    document.querySelectorAll('[id^="exp-title-"]').forEach(el => {
      const i = el.id.split('-')[2];
      expList.push({ title: el.value, company: v(`exp-company-${i}`), start: v(`exp-start-${i}`), end: v(`exp-end-${i}`), desc: v(`exp-desc-${i}`) });
    });
  }
  if (type === 'skill') {
    skillList = [];
    document.querySelectorAll('[id^="skill-name-"]').forEach(el => {
      const i = el.id.split('-')[2];
      const name = el.value;
      const level = v(`skill-level-${i}`) || '80';
      if (name) skillList.push({ name, level });
    });
  }
  if (type === 'lang') {
    langList = [];
    document.querySelectorAll('[id^="lang-name-"]').forEach(el => {
      const i = el.id.split('-')[2];
      const name = el.value;
      const level = document.getElementById(`lang-level-${i}`)?.value || 'Fluent';
      if (name) langList.push({ name, level });
    });
  }
  if (type === 'cert') {
    certList = [];
    document.querySelectorAll('[id^="cert-name-"]').forEach(el => {
      const i = el.id.split('-')[2];
      const name = el.value;
      if (name) certList.push({ name, issuer: v(`cert-issuer-${i}`), year: v(`cert-year-${i}`) });
    });
  }
  liveUpdate();
}

function v(id) { return document.getElementById(id)?.value || ''; }

let liveTimer;
function liveUpdate() {
  clearTimeout(liveTimer);
  liveTimer = setTimeout(generateCV, 100);
}

// ─── GENERATE ───
function generateCV() {
  const data = {
    firstName: v('firstName'), lastName: v('lastName'),
    jobTitle: v('jobTitle'), email: v('email'),
    phone: v('phone'), location: v('location'),
    website: v('website'), summary: v('summary'),
    photo: photoDataURL,
    edu: eduList, exp: expList, skills: skillList,
    langs: langList, certs: certList
  };
  const fullName = (data.firstName + ' ' + data.lastName).trim();
  if (!fullName) {
    document.getElementById('cvPreview').innerHTML = `<div class="empty-cv"><i class="fa fa-file-lines"></i><p>Fill in your details and click<br><strong>Generate Preview</strong></p></div>`;
    document.getElementById('cvPreview').className = 'cv-sheet tpl-' + currentTemplate;
    return;
  }

  let html = '';
  const c = currentColor;
  const cssVar = `style="--cv-color:${c};"`;

  if (currentTemplate === 'classic') html = renderClassic(data, c, cssVar);
  if (currentTemplate === 'modern') html = renderModern(data, c, cssVar);
  if (currentTemplate === 'minimal') html = renderMinimal(data, c, cssVar);

  const sheet = document.getElementById('cvPreview');
  sheet.className = 'cv-sheet tpl-' + currentTemplate;
  sheet.innerHTML = html;
  sheet.setAttribute('style', `--cv-color:${c};`);
}

function renderClassic(d, c, cv) {
  return `
  <div class="cv-header">
    <div style="display:flex;gap:1.5rem;align-items:flex-start;">
      ${d.photo ? `<img src="${d.photo}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.3);flex-shrink:0;"/>` : ''}
      <div>
        <div class="cv-name">${d.firstName} <span style="font-weight:400;">${d.lastName}</span></div>
        ${d.jobTitle ? `<div class="cv-title">${d.jobTitle}</div>` : ''}
        <div class="cv-contact-row">
          ${d.email ? `<span><i class="fa fa-envelope"></i>${d.email}</span>` : ''}
          ${d.phone ? `<span><i class="fa fa-phone"></i>${d.phone}</span>` : ''}
          ${d.location ? `<span><i class="fa fa-location-dot"></i>${d.location}</span>` : ''}
          ${d.website ? `<span><i class="fa fa-link"></i>${d.website}</span>` : ''}
        </div>
      </div>
    </div>
  </div>
  <div class="cv-body">
    <div class="cv-main">
      ${d.summary ? `<div class="cv-summary">${d.summary}</div>` : ''}
      ${d.exp.length ? `<div class="cv-section-title">Work Experience</div>${d.exp.map(e=>`
        <div class="cv-entry">
          <div class="cv-entry-title">${e.title}</div>
          <div class="cv-entry-sub">${e.company}</div>
          ${(e.start||e.end)?`<div class="cv-entry-date">${e.start}${e.end?' – '+e.end:''}</div>`:''}
          ${e.desc?`<div class="cv-entry-desc">${e.desc}</div>`:''}
        </div>`).join('')}` : ''}
      ${d.edu.length ? `<div class="cv-section-title">Education</div>${d.edu.map(e=>`
        <div class="cv-entry">
          <div class="cv-entry-title">${e.degree}</div>
          <div class="cv-entry-sub">${e.inst}</div>
          ${(e.start||e.end)?`<div class="cv-entry-date">${e.start}${e.end?' – '+e.end:''}</div>`:''}
          ${e.desc?`<div class="cv-entry-desc">${e.desc}</div>`:''}
        </div>`).join('')}` : ''}
    </div>
    <div class="cv-side">
      ${d.skills.length ? `<div class="cv-section-title">Skills</div>${d.skills.map(s=>`
        <div class="skill-bar-wrap">
          <div class="skill-bar-label"><span>${s.name}</span><span>${s.level}%</span></div>
          <div class="skill-bar"><div class="skill-bar-fill" style="width:${s.level}%;background:${c};"></div></div>
        </div>`).join('')}` : ''}
      ${d.langs.length ? `<div class="cv-section-title" style="margin-top:1.2rem;">Languages</div>${d.langs.map(l=>`
        <div style="display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:0.4rem;">
          <span>${l.name}</span><span style="color:${c};font-weight:600;">${l.level}</span>
        </div>`).join('')}` : ''}
      ${d.certs.length ? `<div class="cv-section-title" style="margin-top:1.2rem;">Certifications</div>${d.certs.map(c=>`
        <div class="cv-entry" style="margin-bottom:0.7rem;">
          <div style="font-size:0.8rem;font-weight:600;">${c.name}</div>
          <div style="font-size:0.72rem;color:var(--muted);">${c.issuer}${c.year?' · '+c.year:''}</div>
        </div>`).join('')}` : ''}
    </div>
  </div>`;
}

function renderModern(d, c, cv) {
  return `
  <div class="cv-header">
    <div style="display:flex;gap:1.5rem;align-items:center;">
      ${d.photo ? `<img src="${d.photo}" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid ${c};flex-shrink:0;"/>` : ''}
      <div>
        <div class="cv-name">${d.firstName} ${d.lastName}</div>
        ${d.jobTitle ? `<div class="cv-title">${d.jobTitle}</div>` : ''}
        <div class="cv-contact-row">
          ${d.email ? `<span><i class="fa fa-envelope" style="color:${c};"></i>${d.email}</span>` : ''}
          ${d.phone ? `<span><i class="fa fa-phone" style="color:${c};"></i>${d.phone}</span>` : ''}
          ${d.location ? `<span><i class="fa fa-location-dot" style="color:${c};"></i>${d.location}</span>` : ''}
          ${d.website ? `<span><i class="fa fa-link" style="color:${c};"></i>${d.website}</span>` : ''}
        </div>
      </div>
    </div>
  </div>
  <div class="cv-body" style="padding:1rem 2.8rem 2rem;">
    <div class="cv-full">
      ${d.summary ? `<div class="cv-section-title">Profile</div><div class="cv-summary">${d.summary}</div>` : ''}
    </div>
    <div>
      ${d.exp.length ? `<div class="cv-section-title">Experience</div>${d.exp.map(e=>`
        <div class="cv-entry">
          <div class="cv-entry-title">${e.title}</div>
          <div class="cv-entry-sub">${e.company}</div>
          <div class="cv-entry-date">${e.start||''}${e.end?' – '+e.end:''}</div>
          ${e.desc?`<div class="cv-entry-desc">${e.desc}</div>`:''}
        </div>`).join('')}` : ''}
      ${d.edu.length ? `<div class="cv-section-title">Education</div>${d.edu.map(e=>`
        <div class="cv-entry">
          <div class="cv-entry-title">${e.degree}</div>
          <div class="cv-entry-sub">${e.inst}</div>
          <div class="cv-entry-date">${e.start||''}${e.end?' – '+e.end:''}</div>
          ${e.desc?`<div class="cv-entry-desc">${e.desc}</div>`:''}
        </div>`).join('')}` : ''}
    </div>
    <div>
      ${d.skills.length ? `<div class="cv-section-title">Skills</div>${d.skills.map(s=>`
        <div class="skill-bar-wrap">
          <div class="skill-bar-label"><span>${s.name}</span><span style="color:${c};">${s.level}%</span></div>
          <div class="skill-bar"><div class="skill-bar-fill" style="width:${s.level}%;background:${c};"></div></div>
        </div>`).join('')}` : ''}
      ${d.langs.length ? `<div class="cv-section-title" style="margin-top:1rem;">Languages</div>${d.langs.map(l=>`
        <div style="display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:0.35rem;">
          <span>${l.name}</span><span style="color:${c};font-weight:600;">${l.level}</span>
        </div>`).join('')}` : ''}
      ${d.certs.length ? `<div class="cv-section-title" style="margin-top:1rem;">Certifications</div>${d.certs.map(ct=>`
        <div style="margin-bottom:0.6rem;">
          <div style="font-size:0.8rem;font-weight:600;">${ct.name}</div>
          <div style="font-size:0.72rem;color:var(--muted);">${ct.issuer}${ct.year?' · '+ct.year:''}</div>
        </div>`).join('')}` : ''}
    </div>
  </div>`;
}

function renderMinimal(d, c, cv) {
  return `
  <div class="cv-header">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div class="cv-name">${d.firstName} ${d.lastName}</div>
        ${d.jobTitle ? `<div class="cv-title">${d.jobTitle}</div>` : ''}
      </div>
      ${d.photo ? `<img src="${d.photo}" style="width:72px;height:72px;border-radius:6px;object-fit:cover;flex-shrink:0;"/>` : ''}
    </div>
    <div class="cv-contact-row" style="margin-top:0.6rem;">
      ${d.email ? `<span><i class="fa fa-envelope" style="color:${c};"></i>${d.email}</span>` : ''}
      ${d.phone ? `<span><i class="fa fa-phone" style="color:${c};"></i>${d.phone}</span>` : ''}
      ${d.location ? `<span><i class="fa fa-location-dot" style="color:${c};"></i>${d.location}</span>` : ''}
      ${d.website ? `<span><i class="fa fa-link" style="color:${c};"></i>${d.website}</span>` : ''}
    </div>
  </div>
  <div class="cv-body">
    ${d.summary ? `<div class="cv-section-title">About</div><hr class="cv-rule"/><div class="cv-summary" style="margin-top:0.5rem;">${d.summary}</div>` : ''}
    ${d.exp.length ? `<div class="cv-section-title">Experience</div><hr class="cv-rule"/>${d.exp.map(e=>`
      <div class="cv-entry" style="margin-top:0.6rem;">
        <div class="cv-entry-main">
          <div class="cv-entry-title">${e.title}</div>
          <div class="cv-entry-sub">${e.company}</div>
          ${e.desc?`<div class="cv-entry-desc" style="grid-column:1/-1;">${e.desc}</div>`:''}
        </div>
        <div class="cv-entry-right">
          <div class="cv-entry-date">${e.start||''}${e.end?'–'+e.end:''}</div>
        </div>
      </div>`).join('')}` : ''}
    ${d.edu.length ? `<div class="cv-section-title" style="margin-top:1rem;">Education</div><hr class="cv-rule"/>${d.edu.map(e=>`
      <div class="cv-entry" style="margin-top:0.6rem;">
        <div class="cv-entry-main">
          <div class="cv-entry-title">${e.degree}</div>
          <div class="cv-entry-sub">${e.inst}</div>
          ${e.desc?`<div class="cv-entry-desc" style="grid-column:1/-1;">${e.desc}</div>`:''}
        </div>
        <div class="cv-entry-right">
          <div class="cv-entry-date">${e.start||''}${e.end?'–'+e.end:''}</div>
        </div>
      </div>`).join('')}` : ''}
    ${d.skills.length ? `<div class="cv-section-title" style="margin-top:1rem;">Skills</div><hr class="cv-rule"/><div style="margin-top:0.5rem;">${d.skills.map(s=>`<span class="skill-tag">${s.name}</span>`).join('')}</div>` : ''}
    ${d.langs.length ? `<div class="cv-section-title" style="margin-top:1rem;">Languages</div><hr class="cv-rule"/><div style="margin-top:0.5rem;">${d.langs.map(l=>`<span class="skill-tag">${l.name} <em style="font-style:normal;color:${c};">(${l.level})</em></span>`).join(' ')}</div>` : ''}
    ${d.certs.length ? `<div class="cv-section-title" style="margin-top:1rem;">Certifications</div><hr class="cv-rule"/>${d.certs.map(ct=>`
      <div style="margin-top:0.5rem;display:flex;justify-content:space-between;font-size:0.8rem;">
        <span><strong>${ct.name}</strong> — ${ct.issuer}</span>
        <span style="color:${c};">${ct.year}</span>
      </div>`).join('')}` : ''}
  </div>`;
}

// ─── EXPORT PDF ───
function exportPDF() {
  const sheet = document.getElementById('cvPreview');
  if (sheet.querySelector('.empty-cv')) {
    alert('Please generate a CV preview first!');
    return;
  }
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head>
    <meta charset="UTF-8"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    <style>
      body { margin:0; font-family:'DM Sans',sans-serif; }
      @page { size: A4; margin:0; }
      @media print { body { margin:0; } }
    </style>
    <style>${document.querySelector('style').innerText}</style>
    </head><body>
    <div class="${sheet.className}" style="${sheet.getAttribute('style')||''}">${sheet.innerHTML}</div>
    <script>window.onload=()=>{window.print();}<\/script>
  </body></html>`);
  win.document.close();
}

// ─── RESET ───
function resetAll() {
  if (!confirm('Reset all fields?')) return;
  ['firstName','lastName','jobTitle','email','phone','location','website','summary'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  ['eduEntries','expEntries','skillEntries','langEntries','certEntries'].forEach(id => {
    document.getElementById(id).innerHTML = '';
  });
  eduList = []; expList = []; skillList = []; langList = []; certList = [];
  photoDataURL = null;
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('photoIcon').style.display = '';
  document.getElementById('cvPreview').innerHTML = `<div class="empty-cv"><i class="fa fa-file-lines"></i><p>Fill in your details and click<br><strong>Generate Preview</strong></p></div>`;
}
</script>
